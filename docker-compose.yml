services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      STEELCHAIN_DB: /app/data/steelchain.sqlite
      STEELCHAIN_MODEL_DIR: /app/artifacts/models
      STEELCHAIN_MODEL_REPORT: /app/reports/P2_MODEL_EVALUATION.json
    ports:
      - "8000:8000"
    volumes:
      - steelchain-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  steelchain-data:
